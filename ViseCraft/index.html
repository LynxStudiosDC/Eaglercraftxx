<!DOCTYPE html><html style="width:100%;height:100%;background-color:black;"><head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0">
		<meta name="description" content="ViseCraft | Play ViseCraft directly in your browser. Fast, lightweight, and free.">
		<meta name="keywords" content="ViseCraft, Minecraft, browser game, multiplayer, voxel game">
		<title>ViseCraft | ViseCraft 1.20</title>
		<meta property="og:locale" content="en-US">
		<meta property="og:type" content="website">
		<meta property="og:title" content="ViseCraft | ViseCraft 1.20">
		<meta property="og:description" content="ViseCraft | Play ViseCraft directly in your browser. Fast, lightweight, and free.">
		<meta property="og:url" content="">
		<link type="image/png" rel="shortcut icon" href="../../eaglercraft.dev/clients/EaglyMC%201.20%20JS/favicon.png">
		<script type="text/javascript" src="../../eaglercraft.dev/clients/EaglyMC%201.20%20JS/classes.js"></script>
		<script src="/js/ga4.js"></script>
		<script type="text/javascript">
			"use strict";
			window.addEventListener("load", async function() {
				if(window.location.href.indexOf("file:") === 0) {
					alert("HTTP please, do not open this file locally, run a local HTTP server and load it via HTTP");
				}else {
					var relayId = Math.floor(Math.random() * 3);
					window.eaglercraftXOpts = {
						demoMode: false,
						container: "game_frame",
						assetsURI: "assets.epk",
						localesURI: "lang/",
						worldsDB: "worlds",
						logInvalidCerts: true,
						crashOnUncaughtExceptions: true,
						servers: [],
						relays: []
					};

					function applyListConfig(config) {
						if (!config || typeof config !== "object") return;
						if (Array.isArray(config.servers) && config.servers.length) {
							window.eaglercraftXOpts.servers = config.servers;
						}
						if (Array.isArray(config.relays) && config.relays.length) {
							var relays = config.relays.slice();
							if (!relays.some(function(item) { return item && item.primary; })) {
								relays = relays.map(function(item, index) {
									return Object.assign({}, item, { primary: index === relayId });
								});
							}
							window.eaglercraftXOpts.relays = relays;
						}
					}

					async function loadDynamicList() {
						if (typeof window.fetch !== "function") return;
						try {
							var response = await fetch("/list.json", { cache: "no-store" });
							if (!response.ok) return;
							var json = await response.json();
							applyListConfig(json);
						} catch (err) {
							console.warn("Failed to load /list.json, using default client list.", err);
						}
					}

					function initClient() {
						var q = window.location.search;
						if((typeof q === "string") && q[0] === "?" && (typeof window.URLSearchParams !== "undefined")) {
							q = new window.URLSearchParams(q);
							var s = q.get("server");
							if(s) window.eaglercraftXOpts.joinServer = s;
						}

						main();
					}

					await loadDynamicList();
					initClient();
				}
			});
		</script>
	</head>
	<body style="margin:0px;width:100%;height:100%;overflow:hidden;background-color:black;" id="game_frame">
	

</body></html>
